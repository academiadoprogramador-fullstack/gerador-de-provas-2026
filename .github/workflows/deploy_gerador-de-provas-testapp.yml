# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - gerador-de-provas-testapp

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  migrate:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read #This is required for actions/checkout
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore src/eAgenda.WebApp/eAgenda.WebApp.csproj

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply ORM migrations to AzureSQL
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURESQL_CONNECTION_STRING }}
          Infra__NewRelic__LicenseKey: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: |
          dotnet ef database update `
            --project src/eAgenda.Infra/eAgenda.Infra.csproj `
            --startup-project src/eAgenda.WebApp/eAgenda.WebApp.csproj `
            --configuration Release `
            --connection "$env:AZURE_SQL_CONNECTION_STRING"

  deploy:
    runs-on: windows-latest
    needs: [build, migrate]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7492375CB1C14F088D578F40DDC7BB12 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8724913F4BB74932AFED1858F09F0F6A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_90DB5CFB7D61438A863B85B5C1CF8D39 }}

      - name: Configure Azure Web App settings
        shell: pwsh
        run: |
          az webapp config appsettings set `
            --resource-group "gerador-de-provas" `
            --name "gerador-de-provas-testapp" `
            --settings `
              "ConnectionStrings__SqlServerEF=${{ secrets.AZURESQL_CONNECTION_STRING }}" `
              "Infra__NewRelic__LicenseKey=${{ secrets.NEWRELIC_LICENSE_KEY }}" `
              "Apresentacao__AutoMapper__LicenseKey=${{ secrets.AUTOMAPPER_LICENSE_KEY }}"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "gerador-de-provas-testapp"
          slot-name: "Production"
          package: .
